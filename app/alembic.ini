# Alembic configuration. The actual DB URL is supplied by env.py at runtime
# from chemsteer.settings (so ~/.chemsteer-py/assessments.db is created in
# the right place).
[alembic]
script_location = src/chemsteer/db/migrations
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url = sqlite:///${CHEMSTEER_USER_DATA_DIR:-./_dev}/assessments.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
