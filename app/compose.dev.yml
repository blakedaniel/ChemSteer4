# Dev compose: two services so each side can hot-reload independently.
#   - api: uvicorn --reload over ./src
#   - web: vite dev server with HMR over ./frontend
# Vite is configured to proxy /api → api:8000.
services:
  api:
    image: python:3.12-slim-bookworm
    working_dir: /app
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y --no-install-recommends
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2
          libgdk-pixbuf-2.0-0 fontconfig fonts-dejavu mdbtools curl &&
        curl -LsSf https://astral.sh/uv/install.sh | sh &&
        export PATH=/root/.local/bin:$$PATH &&
        uv sync --all-extras &&
        uv run uvicorn chemsteer.api.app:app
          --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
      "
    volumes:
      - ./:/app
      - chemsteer-dev-venv:/app/.venv
      - chemsteer-dev-data:/data
    environment:
      CHEMSTEER_USER_DATA_DIR: /data
      CHEMSTEER_LOG_FORMAT: console
    ports:
      - "127.0.0.1:8000:8000"

  web:
    image: node:20-bookworm-slim
    working_dir: /frontend
    command: >
      bash -c "
        if [ -f package-lock.json ]; then npm ci; else npm install; fi &&
        npm run dev -- --host 0.0.0.0
      "
    volumes:
      - ./frontend:/frontend
      - chemsteer-dev-node-modules:/frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  chemsteer-dev-venv:
  chemsteer-dev-node-modules:
  chemsteer-dev-data:
