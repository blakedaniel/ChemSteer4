[project]
name = "chemsteer"
version = "0.1.0"
description = "Python web app reimplementation of EPA's ChemSTEER (Chemical Screening Tool for Exposures and Environmental Releases)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Blake" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pint>=0.24",
    "weasyprint>=63",
    "jinja2>=3.1",
    "structlog>=24.4",
    "typer>=0.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "sqlacodegen>=3.0.0rc5",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.scripts]
chemsteer = "chemsteer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemsteer"]

[tool.hatch.build.targets.wheel.force-include]
"src/chemsteer/seed_data" = "chemsteer/seed_data"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
]
ignore = ["E501"]    # line length handled by formatter

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Query/Path/Body/Depends/Header/Cookie/File/Form are intentionally
# called as default values — this is the canonical idiom.
extend-immutable-calls = [
    "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Depends", "fastapi.Header", "fastapi.Cookie",
    "fastapi.File", "fastapi.Form",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["pint.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "golden: tests vs captured ChemSTEER v3.2 outputs",
    "unit: User-Guide example fixtures",
    "property: Hypothesis property-based",
    "api: FastAPI integration tests",
]
